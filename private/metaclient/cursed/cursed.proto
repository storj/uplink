syntax = "proto3";
option go_package = "storj.io/uplink/private/metaclient/cursed";

package cursed;

import "encryption.proto";
import "metainfo.proto";
import "pico.proto";
import "pointerdb.proto";
import "google/protobuf/timestamp.proto";

// StreamID is a copy of satellite/internalpb.StreamID. It must stay
// wire compatible with it, the satellite signs the serialized form.
message StreamID {
    reserved 14, 16, 17;
    bytes  bucket = 1;
    bytes  encrypted_object_key = 2;
    int64  version = 3;

    encryption.EncryptionParameters encryption_parameters = 12;

    google.protobuf.Timestamp creation_date = 5 [
        (pico.field).custom_type = "time.Time",
        (pico.field).custom_serialize = "storj.io/picobuf/picoconv.Timestamp",
        (pico.field).always_present = true
    ];
    google.protobuf.Timestamp expiration_date = 6 [
        (pico.field).custom_type = "time.Time",
        (pico.field).custom_serialize = "storj.io/picobuf/picoconv.Timestamp",
        (pico.field).always_present = true
    ];

    bool multipart_object = 11;

    bytes satellite_signature = 9;

    bytes stream_id = 10;

    int32 placement = 13;

    bool versioned = 15;
}

// SegmentID is a copy of satellite/internalpb.SegmentID. It must stay
// wire compatible with it, the satellite signs the serialized form.
message SegmentID {
    StreamID stream_id = 1;
    int32    part_number = 2;
    int32    index = 3;

    bytes root_piece_id = 5 [
        (pico.field).custom_type = "storj.io/common/storj.PieceID",
        (pico.field).always_present = true
    ];
    repeated .metainfo.AddressedOrderLimit original_order_limits = 6;
    google.protobuf.Timestamp creation_date = 7 [
        (pico.field).custom_type = "time.Time",
        (pico.field).custom_serialize = "storj.io/picobuf/picoconv.Timestamp",
        (pico.field).always_present = true
    ];
    pointerdb.RedundancyScheme redundancy_scheme = 9;

    bytes satellite_signature = 8;
}
